<style>
:root {
  --bg: #0b0f17;
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.12);
  --tx: #f8fafc;
  --mut: #94a3b8;
  --pri: #ff6a1a;
  --pri-gradient: linear-gradient(135deg, #ff6a1a 0%, #ff3b00 100%);
  --pri-shadow: rgba(255, 106, 26, 0.35);
  --input-bg: rgba(255, 255, 255, 0.07);
  --ok: #22c55e;
  --no: #ef4444;
}

* { box-sizing: border-box; }

body {
  margin: 0 auto;
  background: var(--bg);
  color: var(--tx);
  font: 16px/1.4 system-ui, -apple-system, sans-serif;
  max-width: 650px;
  padding: 16px 16px 60px;
  min-height: 100vh;
}

h1 {
  font-size: 22px;
  margin: 8px 0 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #fff;
  font-weight: 800;
}

nav { display: flex; gap: 8px; margin-bottom: 16px; }

nav button {
  flex: 1;
  padding: 12px 6px;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  color: var(--mut);
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

nav button.on {
  background: var(--pri-gradient);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 14px var(--pri-shadow);
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.card.alerta { border-color: var(--no); background: rgba(239, 68, 68, 0.08); }

h2 { font-size: 18px; margin: 0 0 12px; color: #fff; font-weight: 700; }
h3 { font-size: 13px; margin: 14px 0 4px; color: var(--mut); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
label { display: block; font-size: 13px; color: var(--mut); margin: 10px 0 4px; font-weight: 500; }

input, select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--input-bg);
  color: var(--tx);
  font-size: 15px;
  outline: none;
  transition: all 0.3s ease;
}

select option { background: #0b0f17; color: #fff; }

input:focus, select:focus {
  border-color: var(--pri);
  box-shadow: 0 0 10px var(--pri-shadow);
}

.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }

.btn {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: var(--pri-gradient);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 18px var(--pri-shadow);
  transition: all 0.2s ease;
}
.btn.sec { background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: none; }
.btn:active { transform: scale(0.98); }

.lnk {
  background: none;
  border: 0;
  color: var(--pri);
  font-size: 14px;
  padding: 6px 12px;
  cursor: pointer;
  font-weight: 600;
}
.lnk.red { color: var(--no); }

.mut { color: var(--mut); font-size: 13px; }

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 10px;
  border-bottom: 1px solid var(--card-border);
  gap: 10px;
}
.item:last-child { border-bottom: 0; }
.item.col { flex-direction: column; align-items: stretch; }

.tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 12px;
  font-weight: 700;
  text-transform: uppercase;
  color: #fff;
  white-space: nowrap;
}

.x { background: none; border: 0; color: var(--no); font-size: 18px; cursor: pointer; font-weight: bold; }

.ed input { padding: 8px 10px; font-size: 14px; }

.modal { position: fixed; inset: 0; background: rgba(5,8,14,.92); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal .box { background: #121826; border: 1px solid var(--card-border); border-radius: 22px; max-width: 560px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 18px; }

.fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fotos figure { margin: 0; text-align: center; }
.fotos img { width: 100%; border-radius: 14px; aspect-ratio: 3/4; object-fit: cover; background: #111; }
.fotos figcaption { font-size: 12px; color: var(--mut); margin-top: 4px; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.thumbs img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; }
.pill { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 10px; background: var(--input-bg); color: var(--mut); margin-right: 4px; }
</style>

function sair() {
  auth.signOut().then(() => { window.location.href = "index.html"; });
}

auth.onAuthStateChanged(async u => {
  if (!u) { window.location.href = "index.html"; return; }
  try {
    const s = await db.doc("users/" + u.uid).get();
    const d = s.exists ? s.data() : null;
    if (!d || d.role !== "instrutor" || d.status !== "ativo") {
      alert("Acesso de instrutor não autorizado ou pausado. Fale com o administrador.");
      await auth.signOut(); window.location.href = "index.html"; return;
    }
    ME = { uid: u.uid, ...d };
    try { PLAN = (await db.doc("plans/main").get()).data() || {}; } catch (e) { PLAN = {}; }
    try { const q = await db.collection("exercicios").where("instrutor", "==", u.uid).get(); CUST = q.docs.map(d => d.data()); } catch (e) { CUST = []; }
    render();
  } catch (e) {
    console.log(e);
    $("app").innerHTML = '<div class="card" style="margin-top:15vh;text-align:center"><h2>Sem conexão</h2><p class="mut">Não foi possível carregar. Verifique a internet.</p><button class="btn" onclick="location.reload()">Tentar de novo</button></div>';
  }
});

let PLAN = {}, tab = "al", curT = "A", curG = Object.keys(G)[0], curA = null;

async function render() {
  const T = [["al", "Alunos" + (ALERTAS.length ? " (" + ALERTAS.length + ")" : "")], ["tr", "Treinos"], ["nu", "Nutri"]];
  $("app").innerHTML = `<h1><span>📋 ${esc(ME.nome || "Instrutor")}</span><button class="lnk" onclick="sair()">Sair</button></h1><nav>${T.map(t => `<button class="${t[0] === tab ? "on" : ""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}</nav><div id="v"></div>`;
  if (tab === "al") await vAlunos();

}

async function vAlunos() {
  $("v").innerHTML = '<div class="mut">Carregando alunos…</div>';
  const t = today(), I = ME.uid;
  const dias = [...Array(14)].map((_, i) => today(new Date(Date.now() - i * 864e5)));
  const safe = p => p.catch(e => { console.log(e); return null; });
  const [us, lss, as, ds, ps] = await Promise.all([
    db.collection("users").where("role", "==", "aluno").where("instrutor", "==", I).get(),
    Promise.all(dias.map(d => safe(db.collection("logs").where("instrutor", "==", I).where("date", "==", d).get()))),
    safe(db.collection("alertas").where("instrutor", "==", I).where("lido", "==", false).get()),
    safe(db.collection("dietas").where("instrutor", "==", I).where("date", "==", t).get()),
    safe(db.collection("lgpd_pedidos").where("instrutor", "==", I).where("status", "==", "pendente").get())

  ALU = us.docs.map(d => ({ id: d.id, ...d.data() }));
  LOGS = lss.flatMap(q => q ? q.docs.map(d => d.data()) : []);
  await Promise.all(ALU.map(a => safe(db.doc("treinos/" + a.id).get()).then(s => { TRC[a.id] = s && s.exists ? s.data() : {}; })));

  DIETS = ds ? ds.docs.map(d => d.data()) : [];
  PEDIDOS = ps ? ps.docs.map(d => ({ id: d.id, ...d.data() })) : [];

      ${ALERTAS.map(a => `<div class="item"><div><b>${esc(a.aluno)}</b> · ${esc(a.exercicio)}
        <div class="mut">Treino ${esc(a.treino)} · de ${esc(a.de || "-")} para <b style="color:#fff">${esc(a.para)}</b> · ${fmtDH(a.ts)}</div></div>
        <button class="lnk" onclick="lerAlerta('${a.id}')">Ok</button></div>`).join("")}
      <button class="btn sec" onclick="lerTodos()">Marcar todos como lidos</button>
    </div>` : "";

  const pedidosHtml = PEDIDOS.length ? `<div class="card alerta">
      <h2>🔒 Pedidos de exclusão de dados (LGPD)</h2>
      ${PEDIDOS.map(p => `<div class="item"><div><b>${esc(p.aluno)}</b><div class="mut">Pediu em ${esc(p.data || "")}</div></div>
        <button class="lnk red" onclick="excluirDados('${esc(p.uid)}')">Excluir dados</button></div>`).join("")}
    </div>` : "";

  $("v").innerHTML = alertasHtml + pedidosHtml + novoForm() + ALU.map(u => {
    const mine = LOGS.filter(l => l.uid === u.id && ((l.done || []).length)).map(l => l.date).sort();
    const last = mine[mine.length - 1];
    const gap = last ? Math.floor((new Date(t) - new Date(last)) / 864e5) : null;
    const lgRaw = LOGS.find(l => l.uid === u.id && l.date === t) || {};
    const lg = { done: lgRaw.done || [], loads: lgRaw.loads || {}, detalhe: lgRaw.detalhe || {} };
    const warn = gap === null || gap >= 3 ? `<span class="tag" style="background:var(--no)">${gap === null ? "nunca treinou" : "sem treinar há " + gap + " dias"}</span>` : "";
    const t0 = u.hoje || "A";
    const tr = TRC[u.id] || {};
    const pl = Array.isArray(tr[t0]) ? tr[t0] : [];
    const feitos = pl.filter((e, i) => lg.done.includes(e.id || (t0 + "_" + i))).length;
    const proprios = Object.values(lg.detalhe).filter(d => d && d.proprio);
    const dieta = DIETS.find(d => d.uid === u.id);
    let dietaTxt = '<span class="mut">sem registro hoje</span>';
    if (dieta && Array.isArray(dieta.itens) && dieta.itens.length) {
      const s = dieta.itens.reduce((a, x) => ({ k: a.k + x.k, p: a.p + x.p, c: a.c + x.c, f: a.f + x.f }), { k: 0, p: 0, c: 0, f: 0 });
      dietaTxt = `<b>${Math.round(s.k)}</b> kcal · P ${r1(s.p)}g · C ${r1(s.c)}g · G ${r1(s.f)}g`;
    }
    const lgpdTag = u.lgpd && u.lgpd.aceito ? '<span class="pill">✔ LGPD</span>' : '<span class="pill" style="color:#f08c00">⚠ sem aceite LGPD</span>';
    const nAl = ALERTAS.filter(a => a.uid === u.id).length;

    return `<div class="card">
      <h2>${esc(u.nome)} ${stt(u)} ${warn}</h2>
      <div class="mut">${esc(u.phone)} · PIN ${esc(u.pin || "sem PIN")}${u.peso ? ` · ${u.peso} kg · ${u.alt} cm · ${u.obj === "perder" ? "perder peso" : "ganhar massa"} · ${u.dias || "?"} dias/sem` : " · sem perfil"} ${lgpdTag}</div>
      ${nAl ? `<div style="margin-top:6px"><span class="tag" style="background:var(--no)">${nAl} aumento${nAl > 1 ? "s" : ""} de carga</span></div>` : ""}

      <h3>Treino ${esc(t0)} de hoje · ${feitos}/${pl.length} feitos</h3>
      ${pl.length ? pl.map((e, i) => {
        const id = e.id || (t0 + "_" + i), ok = lg.done.includes(id), det = lg.detalhe[id];
        return `<div class="item"><div><b>${esc(e.n)}</b>
          <div class="mut">${esc(e.s || "-")}x${esc(e.r || "-")} · carga ${esc(e.carga || "-")}${ok && det && det.ts ? " · feito às " + fmtH(det.ts) : ""}</div></div>
          <span class="tag" style="background:var(--${ok ? "ok" : "no"})">${ok ? "Feito" : "Pendente"}</span></div>`;
      }).join("") : `<div class="mut">Nenhum exercício cadastrado no treino ${esc(t0)} para este aluno.</div>`}

      ${proprios.length ? `<h3>Treino próprio de hoje</h3>` + proprios.map(d => `<div class="item"><div><b>${esc(d.n)}</b>
          <div class="mut">${esc(d.s || "-")}x${esc(d.r || "-")} · carga ${esc(d.carga || "-")} · ${d.ts ? fmtH(d.ts) : ""}</div></div><span class="tag" style="background:#6366f1">Próprio</span></div>`).join("") : ""}

      <h3>Dieta de hoje</h3>
      <div class="mut">🍎 ${dietaTxt}</div>
      ${ctl(u)}
    </div>`;
  }).join("") || '<div class="card mut">Nenhum aluno cadastrado.</div>';

  $("v").insertAdjacentHTML("beforeend", `<div class="card mut" style="font-size:12px">🔒 <b>LGPD:</b> você trata dados pessoais e de saúde dos alunos (peso, fotos, alimentação). Use apenas para o acompanhamento do treino, não compartilhe com terceiros e atenda os pedidos de acesso, correção e exclusão feitos por eles.</div>`);
}

// ===== TREINOS POR ALUNO =====
async function vTreinos() {
  $("v").innerHTML = '<div class="mut">Carregando…</div>';
  if (!ALU.length) {
    const us = await db.collection("users").where("role", "==", "aluno").where("instrutor", "==", ME.uid).get();
    ALU = us.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  if (!ALU.length) { $("v").innerHTML = '<div class="card mut">Cadastre um aluno primeiro na aba Alunos.</div>'; return; }
  if (!curA || !ALU.find(a => a.id === curA)) curA = ALU[0].id;
  if (!TRC[curA]) {
    const s = await db.doc("treinos/" + curA).get();
    TRC[curA] = s.exists ? s.data() : {};
  }
  const aluno = ALU.find(a => a.id === curA), tr = TRC[curA];
  const l = Array.isArray(tr[curT]) ? tr[curT] : [];
  const temPlano = TR.some(t => Array.isArray(PLAN[t]) && PLAN[t].length);

  $("v").innerHTML = `<div class="card">
    <label style="margin-top:0">Aluno</label>
    <select onchange="curA=this.value;render()">${ALU.map(a => `<option value="${a.id}" ${a.id === curA ? "selected" : ""}>${esc(a.nome)}</option>`).join("")}</select>
    <label>Treino</label>
    <select onchange="curT=this.value;render()">${TR.map(t => `<option ${t === curT ? "selected" : ""}>${t}</option>`).join("")}</select>
    <label>Grupo muscular</label>
    <select onchange="curG=this.value;render()">${Object.keys(G).map(x => `<option ${x === curG ? "selected" : ""}>${x}</option>`).join("")}</select>
    <label>Exercício <span class="mut">(digite para buscar em todos os grupos)</span></label>
    <input id="eq" placeholder="Ex: voador, pulley, stiff, esteira..." oninput="filtrarSel()" style="text-transform:none">
    <select id="en" style="margin-top:6px">${opcoesEx("")}</select>
    <label>Não achou? Digite o nome do exercício</label>
    <input id="ecustom" placeholder="Exercício personalizado (fica salvo para você)">
    <div class="row">
      <div><label>Séries</label><input id="se" type="number" value="3"></div>
      <div><label>Repetições</label><input id="rp" value="12"></div>
      <div><label>Carga</label><input id="cg" placeholder="ex: 20kg"></div>
    </div>
    <label>Link do GIF/imagem de execução (opcional)</label>
    <input id="gf" placeholder="https://...">
    <button class="btn" onclick="addE()">Adicionar ao treino ${curT} de ${esc(aluno.nome)}</button>
  </div>
  <div class="card">
    <h2>Treino ${curT} · ${esc(aluno.nome)}</h2>
    ${l.map(e => `<div class="item col ed">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <div><b>${esc(e.n)}</b><div class="mut">${esc(e.g)}${e.gif ? " · 🎞" : ""}</div></div>
          <button class="x" onclick="delE('${e.id}')">✕</button>
        </div>
        <div class="row" style="margin-top:6px">
          <input type="number" value="${esc(e.s)}" placeholder="Séries" onchange="editE('${e.id}','s',this.value)">
          <input value="${esc(e.r)}" placeholder="Reps" onchange="editE('${e.id}','r',this.value)">
          <input value="${esc(e.carga || "")}" placeholder="Carga" onchange="editE('${e.id}','carga',this.value)">
        </div>
      </div>`).join("") || '<span class="mut">Sem exercícios cadastrados para este aluno neste treino.</span>'}
  </div>
  ${temPlano ? `<div class="card"><h2>Plano geral antigo</h2><div class="mut">Existe um plano geral (A–E) cadastrado antes. Você pode copiá-lo para este aluno e depois ajustar.</div>
    <button class="btn sec" onclick="copiarPlano()">Copiar plano geral para ${esc(aluno.nome)}</button></div>` : ""}`;
}

// Lê o treino atual do aluno no servidor (evita sobrescrever a carga que o aluno acabou de mudar)
async function treinoFresco() {
  const s = await db.doc("treinos/" + curA).get();
  TRC[curA] = s.exists ? s.data() : {};
  return TRC[curA];
}
async function gravarTreino(t, arr) {
  TRC[curA][t] = arr;
  await db.doc("treinos/" + curA).set({ [t]: arr }, { merge: true });
}

const nzs = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function opcoesEx(q) {
  const ws = nzs(q || "").split(/\s+/).filter(Boolean), out = [];
  Object.keys(G).forEach(g => {
    if (!ws.length && g !== curG) return;
    const nomes = G[g].split("|").concat(CUST.filter(c => c.g === g).map(c => c.n));
    [...new Set(nomes)].forEach(n => {
      if (ws.every(w => nzs(n + " " + g).includes(w))) out.push(`<option value="${esc(g)}|${esc(n)}">${esc(n)}${ws.length ? " · " + esc(g) : ""}</option>`);
    });
  });
  return out.join("") || '<option value="">Nenhum encontrado - digite o nome abaixo</option>';
}
function filtrarSel() { $("en").innerHTML = opcoesEx($("eq").value); }

async function addE() {
  try {
    const tr = await treinoFresco();
    const arr = Array.isArray(tr[curT]) ? tr[curT].slice() : [];
    const custom = $("ecustom").value.trim();
    let g = curG, n;
    if (custom) n = custom;
    else {
      const v = $("en").value;
      if (!v) { alert("Escolha um exercício ou digite o nome."); return; }
      const k = v.indexOf("|"); g = v.slice(0, k); n = v.slice(k + 1);
    }
    arr.push({ id: "e" + Date.now(), n, g, s: $("se").value, r: $("rp").value, carga: $("cg").value.trim(), gif: $("gf").value.trim() });
    await gravarTreino(curT, arr);
    if (custom && !CUST.some(c => c.n === n && c.g === g)) {
      const slug = nzs(n).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      try { await db.doc("exercicios/" + ME.uid.slice(0, 8) + "_" + slug).set({ n, g, instrutor: ME.uid, ts: Date.now() }); CUST.push({ n, g }); } catch (e) { console.log(e); }
    }
    toast("Exercício adicionado");
  } catch (e) { console.log(e); alert("Não foi possível salvar: " + e.message); }
  render();
}

async function editE(id, campo, val) {
  try {
    const tr = await treinoFresco();
    const arr = Array.isArray(tr[curT]) ? tr[curT].slice() : [];
    const e = arr.find(x => x.id === id); if (!e) return;
    e[campo] = String(val).trim();
    await gravarTreino(curT, arr);
    toast("Salvo");
  } catch (e) { console.log(e); alert("Não foi possível salvar: " + e.message); }
}

async function delE(id) {
  if (!confirm("Remover este exercício do treino do aluno?")) return;
  try {
    const tr = await treinoFresco();
    const arr = (Array.isArray(tr[curT]) ? tr[curT] : []).filter(e => e.id !== id);
    await gravarTreino(curT, arr);
  } catch (e) { console.log(e); alert("Não foi possível remover: " + e.message); }
  render();
}

async function copiarPlano() {
  const a = ALU.find(x => x.id === curA);
  if (!confirm("Copiar o plano geral para " + a.nome + "? Isso substitui os treinos que ele já tem nas letras copiadas.")) return;
  try {
    const dados = {};
    TR.forEach(t => {
      if (Array.isArray(PLAN[t]) && PLAN[t].length) dados[t] = PLAN[t].map(e => ({ ...e, carga: e.carga || "" }));
    });
    await db.doc("treinos/" + curA).set(dados, { merge: true });
    TRC[curA] = { ...(TRC[curA] || {}), ...dados };
    toast("Plano copiado");
  } catch (e) { console.log(e); alert("Não foi possível copiar: " + e.message); }
  render();
}

// ===== FOTOS DE EVOLUÇÃO DO ALUNO =====
async function verFotos(id) {
  const a = ALU.find(x => x.id === id) || {};
  toast("Carregando fotos...");
  try {
    const q = await db.collection("fotos").where("uid", "==", id).where("instrutor", "==", ME.uid).get();
    FOT = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((x, y) => x.ts - y.ts);
  } catch (e) { console.log(e); return alert("Não foi possível carregar as fotos."); }
  const m = document.createElement("div");
  m.className = "modal"; m.id = "fotom";
  m.innerHTML = `<div class="box"><h2>📸 ${esc(a.nome)}</h2>
    ${FOT.length ? `
      ${FOT.length > 1 ? `<div class="row">
        <div><label style="margin-top:0">Antes</label><select id="fa" onchange="compFoto()">${FOT.map((f, i) => `<option value="${i}" ${i === 0 ? "selected" : ""}>${dt(f.ts)}</option>`).join("")}</select></div>
        <div><label style="margin-top:0">Depois</label><select id="fb" onchange="compFoto()">${FOT.map((f, i) => `<option value="${i}" ${i === FOT.length - 1 ? "selected" : ""}>${dt(f.ts)}</option>`).join("")}</select></div>
      </div>` : '<div class="mut">Só há uma foto até agora.</div>'}
      <div id="comp" style="margin-top:10px"></div>
      <h3>Histórico</h3><div class="thumbs">${FOT.map(f => `<div><img src="${f.img}" alt=""><div class="mut" style="font-size:11px;text-align:center">${dt(f.ts)}</div></div>`).join("")}</div>
    ` : '<div class="mut">Este aluno ainda não enviou fotos.</div>'}
    <button class="btn" onclick="$('fotom').remove()">Fechar</button></div>`;
  document.body.appendChild(m);
  if (FOT.length) compFoto();
}

function compFoto() {
  const a = FOT[$("fa") ? +$("fa").value : 0], b = FOT[$("fb") ? +$("fb").value : FOT.length - 1];
  const fig = (f, t) => `<figure><img src="${f.img}" alt=""><figcaption><b>${t}</b> · ${dt(f.ts)}${f.peso ? " · " + f.peso + " kg" : ""}</figcaption></figure>`;
  let dif = "";
  if (a !== b && a.peso && b.peso) {
    const d = r1(b.peso - a.peso);
    dif = `<div class="mut" style="text-align:center;margin-top:8px">Variação de peso: <b style="color:#fff">${d > 0 ? "+" : ""}${d} kg</b> em ${Math.max(0, Math.round((b.ts - a.ts) / 864e5))} dias</div>`;
  }
  $("comp").innerHTML = `<div class="fotos">${fig(a, "Antes")}${a === b ? "" : fig(b, "Depois")}</div>${dif}`;
}

// ===== LGPD: EXCLUSÃO DE DADOS DO ALUNO =====
async function excluirDados(id) {
  const a = ALU.find(x => x.id === id) || { nome: "este aluno" };
  if (!confirm("Excluir TODOS os dados de " + a.nome + " (treinos, fotos, dieta, registros e cadastro)? Não dá para desfazer.")) return;
  if (!confirm("Confirma a exclusão definitiva dos dados de " + a.nome + "?")) return;
  try {
    for (const c of ["fotos", "logs", "alertas", "dietas"]) {
      const q = await db.collection(c).where("uid", "==", id).where("instrutor", "==", ME.uid).get();
      for (let i = 0; i < q.docs.length; i += 400) {
        const b = db.batch();
        q.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
        await b.commit();
      }
    }
    await db.doc("treinos/" + id).delete();
    await db.doc("treinos_aluno/" + id).delete();
    const ped = await db.collection("lgpd_pedidos").where("uid", "==", id).where("instrutor", "==", ME.uid).get();
    for (const d of ped.docs) await d.ref.update({ status: "concluido", concluidoEm: Date.now() });
    await db.doc("users/" + id).delete();
    delete TRC[id];
    alert("Dados apagados do sistema.\n\nFalta um passo manual: no Firebase Console, vá em Authentication e remova o login deste aluno (telefone@academia.app).");
  } catch (e) { console.log(e); alert("Não foi possível excluir tudo: " + e.message); }
  render();
}

// ===== CADASTRO E CONTROLE DE ALUNOS =====
const rnd = () => String(Math.floor(1000 + Math.random() * 9000));
const novoForm = () => `<div class="card">
  <h2>Novo Aluno</h2>
  <div class="row">
    <div><label>Nome</label><input id="nn"></div>
    <div><label>Telefone (com DDD)</label><input id="np" type="tel" inputmode="tel"></div>
  </div>
  <label>PIN de 4 números</label>
  <input id="npin" inputmode="numeric" maxlength="4" value="${rnd()}">
  <button class="btn" onclick="novoAluno()">Cadastrar Aluno</button>
  <div class="mut" style="margin-top:6px">O aluno entra com telefone + PIN.</div>
</div>`;

const stt = u => {
  const s = u.status || "ativo", c = { ativo: "var(--ok)", pausado: "#f08c00", bloqueado: "var(--no)" }[s] || "var(--mut)";
  return `<span class="tag" style="background:${c}">${esc(s)}</span>`;
};

const ctl = u => `<div class="row" style="margin-top:10px;flex-wrap:wrap">
  <button class="lnk" onclick="irTreino('${u.id}')">📋 Treino</button>
  <button class="lnk" onclick="verFotos('${u.id}')">📸 Fotos</button>
  <button class="lnk" onclick="setSt('${u.id}','ativo')">Ativar</button>
  <button class="lnk" onclick="setSt('${u.id}','pausado')">Pausar</button>
  <button class="lnk" onclick="setSt('${u.id}','bloqueado')">Bloquear</button>
  <button class="lnk" onclick="edNome('${u.id}')">Editar Nome</button>
  <button class="lnk" onclick="novoPin('${u.id}')">Novo PIN</button>
  <button class="lnk red" onclick="excluirDados('${u.id}')">Excluir dados</button>
</div>`;

function irTreino(id) { curA = id; tab = "tr"; render(); window.scrollTo(0, 0); }

async function setSt(id, s) {
  await db.doc("users/" + id).update({ status: s });
  render();
}

async function edNome(id) {
  const a = ALU.find(x => x.id === id), n = prompt("Nome do aluno:", a.nome);
  if (n && n.trim()) {
    await db.doc("users/" + id).update({ nome: n.trim() });
    render();
  }
}

async function novoPin(id) {
  const a = ALU.find(x => x.id === id), p = prompt("Novo PIN de 4 números para " + a.nome + ":", rnd());
  if (p === null) return;
  const pin = p.trim();
  if (!/^\d{4}$/.test(pin)) return alert("O PIN precisa ter 4 números.");

  const sec = firebase.initializeApp(CFG, "sec" + Date.now());
  try {
    const old = a.pin ? pwAluno(a.phone, a.pin) : "Tn@" + a.phone + "#treino26";
    const c = await sec.auth().signInWithEmailAndPassword(em(a.phone), old);
    await c.user.updatePassword(pwAluno(a.phone, pin));
    await db.doc("users/" + id).update({ pin: pin });
    await sec.auth().signOut();
    alert("PIN alterado com sucesso: " + pin);
  } catch (e) {
    alert("Não foi possível trocar o PIN: " + e.message);
  } finally {
    sec.delete();
  }
  render();
}

async function novoAluno() {
  const n = $("nn").value.trim(), ph = fone($("np").value), pin = $("npin").value.trim();
  if (!n || ph.length < 10) return alert("Preencha o nome e o telefone com DDD.");
  if (!/^\d{4}$/.test(pin)) return alert("O PIN precisa ter 4 números.");

  const sec = firebase.initializeApp(CFG, "sec" + Date.now());
  try {
    const c = await sec.auth().createUserWithEmailAndPassword(em(ph), pwAluno(ph, pin));
    await db.doc("users/" + c.user.uid).set({ nome: n, phone: ph, pin: pin, role: "aluno", status: "ativo", instrutor: ME.uid });
    await sec.auth().signOut();
    alert("Aluno cadastrado com sucesso! PIN: " + pin + " (passe ao aluno)");
  } catch (e) {
    alert(e.code === "auth/email-already-in-use" ? "Esse telefone já está cadastrado." : "Erro: " + e.message);
  } finally {
    sec.delete();
  }
  render();
}
